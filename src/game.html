<title>Landscraper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=DM+Mono:wght@500&display=swap">
<style>
:root {
  --ink: #ffffff;
  --ink-soft: rgba(255, 255, 255, 0.78);
  --shade: rgba(16, 24, 56, 0.55);
  --card: rgba(18, 24, 58, 0.72);
  --line: rgba(255, 255, 255, 0.18);
  --gold: #ffd166;
  --bad: #ff5a7a;
  --good: #7cf3c4;
  --display: 'Unbounded', 'Arial Black', system-ui, sans-serif;
  --mono: 'DM Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body {
  background: #1b2a55; color: var(--ink); font-family: var(--mono);
  overflow: hidden; touch-action: none; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#stage:focus { outline: none; }
#stage { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(180deg, var(--sky1, #7cc8ff) 0%, var(--sky2, #d6efff) 100%); transition: background 0.6s; }
#stage::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: var(--world-scene) center / 100% 100% no-repeat; opacity: .62; filter: blur(1px); }
#stage canvas { position: absolute; inset: 0; display: block; }
.ts { text-shadow: 0 1px 2px rgba(10, 20, 50, 0.55), 0 1px 10px rgba(10, 20, 50, 0.45); }

/* Compact badges for context and time; progress sits below the hearts. */
#hud {
  position: absolute; left: 0; right: 0; top: 0; display: grid; grid-template-columns: 40px minmax(0, 1fr) 70px; align-items: start; gap: 10px; row-gap: 4px; pointer-events: none;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px));
}

#pauseBtn {
  pointer-events: auto; width: 40px; height: 40px; border-radius: 14px; border: 0; cursor: pointer; display: grid; place-items: center;
  background: var(--shade); color: var(--ink); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
#pauseBtn svg { width: 16px; height: 16px; }
.mid { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding-top: 2px; }
.hud-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.hud-level, .hud-time { display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.hud-level { min-width: 0; flex-direction: column; align-items: flex-start; gap: 2px; }
.hud-level b { font: 800 15px/1.2 var(--display); }
.hud-score { display: inline-flex; align-items: baseline; gap: 3px; color: #fff0c2; font: 700 11px/1.1 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: 0; }
.hud-score small { font: 500 8px/1 var(--mono); letter-spacing: .04em; opacity: .85; }
#lvlLabel { color: #fff; }
.hud-time { padding: 6px 8px; border-radius: 12px; color: #fff; background: rgba(12,20,48,.25); border: 1px solid rgba(255,255,255,.2); }
.clock-icon { width: 13px; height: 13px; flex: none; opacity: .85; }
.hud-status { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
#clock { font: 800 16px/1.2 var(--display); font-style: normal; font-variant-numeric: tabular-nums; letter-spacing: 0; display: inline-block; transition: transform 0.15s, color 0.15s; }
.hud-time.low { color: #ffad82; background: rgba(12,20,48,.6); }
#clock.low { color: #ffad82; animation: lowt 1s ease-in-out infinite; }
#clock.bump { transform: scale(1.3); color: #ffd166; }
@keyframes lowt { 50% { transform: scale(1.15); } }
#pctLabel { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; font: 500 10px/1.2 var(--mono); letter-spacing: 0; white-space: nowrap; }
#pctLabel b { font: 800 16px/1.2 var(--display); color: var(--ink); }
#pctLabel .hud-board { color: var(--ink-soft); }
@media (max-width: 360px) {
  #hud { padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); gap: 8px; row-gap: 4px; }
  .hud-level b { font-size: 12px; }
  #clock { font-size: 13px; }
  #hud[data-mode="daily"] #clock { font-size: 12px; }
  .hud-row, .hud-time { gap: 4px; }
  .hud-time { padding: 5px; }
}
@media (prefers-reduced-motion: reduce) { #clock.low { animation: none; } #clock.bump { transform: none; } }
.bar { position: relative; height: 8px; margin: 7px 0 18px; border-radius: 999px; background: rgba(12,20,48,.28); box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px; background: linear-gradient(90deg, #7cf3c4, #4fd2ff); transition: width 0.45s cubic-bezier(.2,.9,.3,1.2); }
.bar.goal i { background: linear-gradient(90deg, #ffd166, #ff9f5a); }
.bar em { position: absolute; top: 50%; width: 3px; height: 20px; border-radius: 2px; background: #fff; box-shadow: 0 0 8px #fff4ca; transform: translate(-50%, -50%); font-style: normal; }
.bar em span { position: absolute; top: 23px; left: 50%; transform: translateX(-50%); color: #fff5cc; font: 700 12px/1 var(--mono); text-shadow: 0 1px 3px #243a54; }
.bar .bar-milestone { position: absolute; top: 50%; width: 1.5px; height: 12px; border-radius: 1px; transform: translate(-50%, -50%); background: rgba(255,255,255,.65); }
.bar .bar-milestone.hit { background: #fff0b3; box-shadow: 0 0 4px rgba(255,209,102,.7); }
.bar.goal em { background: #fff2b3; box-shadow: 0 0 12px #ffe18a; animation: goalShine .9s ease-out both; }
.bar.goal em::after { content: ''; position: absolute; inset: -7px -10px; border-radius: 50%; background: radial-gradient(ellipse, rgba(255,228,150,.8), transparent 70%); animation: goalRing .9s ease-out both; }
@keyframes goalShine { 0% { filter: brightness(1); } 40% { filter: brightness(1.8) drop-shadow(0 0 8px #fff0b3); } 100% { filter: brightness(1); } }
@keyframes goalRing { from { transform: scale(.6); opacity: .9; } to { transform: scale(2); opacity: 0; } }
#hud.hud-paused .bar.goal em, #hud.hud-paused .bar.goal em::after { animation-play-state: paused; }
@media (prefers-reduced-motion: reduce) { .bar.goal em { animation: none; } .bar.goal em::after { display: none; } .bar i { transition: none; } }
.endbar { position: relative; width: 100%; margin: 4px 0 2px; padding-bottom: 20px; }
.endbar .track { position: relative; height: 14px; border-radius: 999px; background: var(--shade); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.endbar .track i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px; background: linear-gradient(90deg, #7cf3c4, #4fd2ff); }
.endbar .track i.goal { background: linear-gradient(90deg, #ffd166, #ff9f5a); }
.endbar .tk { position: absolute; top: -3px; width: 2px; height: 20px; margin-left: -1px; background: rgba(255,255,255,0.5); border-radius: 2px; }
.endbar .tk .tks { position: absolute; top: -24px; left: 50%; width: 18px; height: 18px; margin-left: -9px; color: rgba(255,255,255,0.25); transition: color 0.2s, transform 0.25s cubic-bezier(.2,.9,.3,1.8); }
.endbar .tk.hit .tks { color: var(--gold); transform: scale(1.25); filter: drop-shadow(0 0 6px rgba(255,209,102,0.9)); }
.endbar { margin-top: 22px; }
.endbar.daily .track i.goal { background: linear-gradient(90deg, #7ff5e2, #34cdb6); } .endbar.daily .tk.hit .tks { color: #7ff5e2; filter: drop-shadow(0 0 6px rgba(127,245,226,0.9)); }
.endbar .tk span { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); font: 500 10px var(--mono); letter-spacing: 0.04em; color: rgba(255,255,255,0.45); transition: color 0.2s, transform 0.25s cubic-bezier(.2,.9,.3,1.8); }
.endbar .scale-start { position: absolute; left: 0; top: 19px; color: rgba(255,255,255,.45); font: 500 10px var(--mono); letter-spacing: .04em; }
.endbar .tk.hit { background: #fff; }
.endbar .tk.hit { background: #fff; box-shadow: 0 0 6px rgba(255,209,102,0.9); }
.endbar .tk.hit span { color: var(--gold); transform: translateX(-50%) scale(1.15); }
.card .more { transition: opacity 0.4s; }
.lives { display: grid; grid-template-columns: repeat(6, 10px); grid-auto-rows: 20px; gap: 3px 2px; min-height: 43px; align-content: start; justify-items: center; }
.lives:empty { display: none; }
.lives svg { grid-column: span 2; width: 20px; height: 20px; filter: drop-shadow(0 1px 4px rgba(10,20,50,0.4)); }
.lives svg:nth-child(4) { grid-column: 2 / 4; grid-row: 2; }
.lives svg:nth-child(5) { grid-column: 4 / 6; grid-row: 2; }
.lives svg:nth-child(4):last-child { grid-column: 3 / 5; }
.lives svg.off { opacity: 0.28; }
#power { grid-column: 1 / -1; justify-self: center; min-height: 30px; align-items: center; pointer-events: none; display: flex; gap: 8px; }
.hud-notices { grid-column: 1 / -1; min-height: var(--notice-height, 72px); }
#power .pw { display: flex; align-items: center; gap: 8px; padding: 3px 10px 3px 3px; border-radius: 999px; background: rgba(12,20,48,0.78); color: var(--c); font: 700 11px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap; box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--c) 45%, transparent); }
#power .pw i { position: relative; width: 24px; height: 24px; display: grid; place-items: center; }
#power .pr { position: absolute; inset: 0; transform: rotate(-90deg); } #power .pr circle { fill: none; stroke: rgba(255,255,255,0.14); stroke-width: 4; } #power .pr .pp { stroke: var(--c); stroke-dasharray: 107; stroke-linecap: round; }
#power.tight .pw { font-size: 0; gap: 0; padding: 3px; } /* several at once: icons only */
#power .ic { width: 15px; height: 15px; color: var(--c); }
@media (max-height: 500px) and (min-width: 600px) {
  .mid { grid-column: 2; grid-row: 1; }
  .hud-status { grid-column: 3; grid-row: 1; }
  #power { grid-column: 2; grid-row: 1; align-self: start; padding-top: 2px; }
  #power .pw { font-size: 0; gap: 0; padding: 3px; }
}

#flash {
  position: absolute; left: 50%; top: calc(var(--hud-bottom, 140px) - var(--notice-height, 72px) + 4px); transform: translate(-50%, 4px) scale(.96); text-align: center; pointer-events: none;
  width: max-content; max-width: calc(100% - 32px); box-sizing: border-box; overflow-wrap: anywhere;
  font: 800 clamp(13px, 3.6vw, 16px)/1.2 var(--display); opacity: 0; transition: opacity .2s, transform .2s;
  padding: 4px 8px; border-radius: 10px; background: transparent;
  text-shadow: 0 1px 2px rgba(10,20,50,.7), 0 1px 6px rgba(10,20,50,.5);
}
#hud[hidden] ~ #flash { top: calc(10px + env(safe-area-inset-top, 0px)); }
#flash.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
#flash.out { opacity: 0; transform: translate(-50%, -8px) scale(.98); transition: opacity .35s, transform .35s; }
#flash.held { visibility: hidden; }
#flash small + small { margin-top: 3px; color: #7cf3c4; }
#flash small { display: block; margin-top: 4px; font: 500 11px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
#flash.bad { color: #ffe0e6; background: rgba(70,12,30,.54); }
#adSim { position: fixed; inset: 0; z-index: 100; background: #101320; color: #fff; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; }
#adSim[hidden] { display: none; }
#adSim .adbox { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 320px; }
#adSim .big { font: 800 44px var(--display); }
#adSim p { margin: 0; color: rgba(255,255,255,0.7); font-size: 13px; line-height: 1.5; }
#adClose:disabled { opacity: 0.4; }
.btn.world-next { background: var(--next-world-bg); color: #fff; font-weight: 700; text-shadow: 0 1px 2px rgba(12,20,48,.65); }
.btn small { display: block; font-size: 11px; opacity: 0.7; letter-spacing: 0.12em; margin-top: 2px; }
.cal button { all: unset; cursor: pointer; aspect-ratio: 1; border-radius: 10px; display: grid; place-items: center; background: rgba(255,255,255,0.08); }
.cal button.done { background: var(--gold); color: #3a2a00; font-weight: 700; }
.cal button.late { background: rgba(255,209,102,0.45); color: #3a2a00; }
.cal div.future { opacity: 0.35; }
.calnav { display: flex; align-items: center; justify-content: center; gap: 14px; }
.calnav button { all: unset; cursor: pointer; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 800 18px var(--display); background: rgba(255,255,255,0.12); color: var(--ink); }
.calnav button[disabled] { opacity: 0.25; cursor: default; }
.tplus { position: absolute; z-index: 5; pointer-events: none; font: 800 22px var(--display); color: #ffd166; text-shadow: 0 2px 0 rgba(20,30,80,0.45), 0 0 12px rgba(255,209,102,0.6); transform: translate(-50%, -50%) scale(0.4); opacity: 0;
  transition: left 0.6s cubic-bezier(.5,0,.75,0), top 0.6s cubic-bezier(.5,0,.75,0), transform 0.25s cubic-bezier(.2,.9,.3,1.6), opacity 0.2s; }
.tplus.on { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
.tplus.go { transform: translate(-50%, -50%) scale(0.6); }
#pctLabel b { display: inline-block; transition: transform 0.15s, color 0.15s; }
#pctLabel.bump b { transform: scale(1.35); color: #ffd166; }
.pop { position: absolute; pointer-events: none; font: 800 18px var(--display); color: #fff; text-shadow: 0 2px 0 rgba(20,30,80,0.35); transform: translate(-50%, -50%); animation: pop 1s ease-out forwards; }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, -30%) scale(0.6); } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -160%) scale(1); } }
#vignette { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 120px 30px rgba(255, 40, 80, 0.55); opacity: 0; transition: opacity 0.35s; }
#vignette.on { opacity: 1; transition: none; }

/* direction pad: appears where the finger lands and stays there; the active arrow lights up */
/* fixed buttons: a cross at the bottom; slide between arrows without lifting */
#dpad { position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 162px; height: 162px; margin-left: -81px; touch-action: none; }
#dpad[hidden] { display: none; }
#dpad b { position: absolute; width: 54px; height: 54px; border-radius: 18px; display: grid; place-items: center; color: rgba(255,255,255,0.92);
  background: radial-gradient(circle at 50% 30%, rgba(60,80,150,0.55), rgba(16,24,56,0.6) 75%); box-shadow: inset 0 0 0 2px rgba(255,255,255,0.35), 0 6px 16px rgba(10,20,50,0.3);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); transition: transform 0.08s, color 0.08s, background 0.08s; }
#dpad b svg { width: 28px; height: 28px; filter: drop-shadow(0 1px 2px rgba(10,20,50,0.4)); }
#dpad .up { left: 54px; top: 0; } #dpad .down { left: 54px; bottom: 0; } #dpad .left { left: 0; top: 54px; } #dpad .right { right: 0; top: 54px; }
#dpad .down svg { transform: rotate(180deg); } #dpad .left svg { transform: rotate(-90deg); } #dpad .right svg { transform: rotate(90deg); }
#dpad b.lit { color: #ffd166; background: radial-gradient(circle at 50% 30%, rgba(90,110,190,0.75), rgba(26,36,80,0.75) 75%); box-shadow: inset 0 0 0 2px #ffd166, 0 4px 12px rgba(10,20,50,0.3); transform: scale(0.94); }
#dpad b.hint { animation: dhint 1s ease-in-out infinite; }
@keyframes dhint { 50% { color: #ffd166; transform: scale(1.12); } }
#pad { position: absolute; width: 160px; height: 160px; margin: -80px 0 0 -80px; pointer-events: none; opacity: 0; transform: scale(0.8); transition: opacity 0.12s, transform 0.18s cubic-bezier(.2,.9,.3,1.4); }
#pad.on { opacity: 1; transform: scale(1); }
#pad svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 4px 10px rgba(10,20,50,0.3)); }
#pad .wf { fill: rgba(16,24,56,0.38); stroke: rgba(255,255,255,0.55); stroke-width: 1.5; transition: fill 0.1s, stroke 0.1s; }
#pad .wc { fill: none; stroke: rgba(255,255,255,0.85); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.1s; }
#pad .w.lit .wf { fill: rgba(255,209,102,0.85); stroke: #fff6d8; }
#pad .w.lit .wc { stroke: #3a2a00; }
#pad .knob { position: absolute; left: 50%; top: 50%; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #ffffff, #dfe6ff); box-shadow: 0 3px 10px rgba(10,20,50,0.4), inset 0 -2px 0 rgba(0,0,0,0.1); }

/* coach: short tips with a moving finger, first level only */
#coach { position: absolute; left: 0; right: 0; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 14px; pointer-events: none; opacity: 0; transition: opacity 0.25s; }
#coach.on { opacity: 1; }
#coach.high { bottom: calc(200px + env(safe-area-inset-bottom, 0px)); }
#coach b { padding: 10px 18px; border-radius: 999px; background: rgba(16, 24, 56, 0.72); font: 800 18px var(--display); color: #fff; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
#coach .finger { width: 46px; height: 46px; filter: drop-shadow(0 3px 6px rgba(10,20,50,0.4)); animation: swipeUp 1.3s ease-in-out infinite; }
#coach .finger[hidden] { display: none; }
@keyframes swipeUp { 0% { transform: translateY(26px); opacity: 0; } 20% { opacity: 1; } 70% { transform: translateY(-34px); opacity: 1; } 100% { transform: translateY(-40px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #coach .finger { animation: none; } }

/* panels */
#panel {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: calc(20px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(12, 18, 44, 0.38);
}
.card {
  width: min(400px, 100%); max-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 14px;
  padding: 24px 20px 20px; border-radius: 28px; text-align: center; overflow-y: auto;
  background: var(--card); border: 1px solid var(--line); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  animation: cardIn 0.35s cubic-bezier(.2,.9,.3,1.25);
}
#card.swap { animation: none; }
#card.anchored { align-self: flex-start; margin-top: var(--card-top, 0px); max-height: calc(100% - var(--card-top, 0px)); animation: none; }
#card.swap > * { animation: swapIn 0.2s ease-out 0.2s both; }
@keyframes swapIn { from { opacity: 0; } } /* content appears once the card has reached its new size, so nothing slides */
@keyframes cardIn { from { opacity: 0; transform: translateY(18px) scale(0.96); } }
.card h1 { margin: 0; font: 800 34px/1 var(--display); letter-spacing: -0.01em; }
.card h2 { margin: 0; font: 800 26px/1.05 var(--display); text-wrap: balance; }
.card p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--ink-soft); text-wrap: balance; }
.card .kicker { font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
.card .level-context { font-size: 14px; line-height: 1.3; letter-spacing: 0.16em; }
.card .big { font: 800 44px/1 var(--display); font-variant-numeric: tabular-nums; }
.card .got { font: 800 17px var(--display); color: var(--gold); letter-spacing: 0; }
.btns { width: 100%; display: flex; flex-direction: column; gap: 10px; }
.btn {
  cursor: pointer; width: 100%; padding: 15px 18px; border-radius: 999px; border: 0;
  background: #fff; color: #1d2a63; font: 500 13px var(--mono); letter-spacing: 0.14em; text-transform: uppercase;
  box-shadow: 0 4px 0 rgba(10, 20, 60, 0.35);
}
.btn.cdb { position: relative; overflow: hidden; }
.btn .cd { position: absolute; left: 0; bottom: 0; height: 5px; width: 100%; background: var(--gold); transform-origin: left; animation: cdBar 10s linear forwards; }
@keyframes cdBar { to { transform: scaleX(0); } }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(10, 20, 60, 0.35); }
.btn.alt { background: rgba(255,255,255,0.12); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.stars { display: flex; gap: 10px; }
.stars svg { width: 44px; height: 44px; color: rgba(255,255,255,0.18); }
.stars svg.on { color: var(--gold); animation: star 0.45s cubic-bezier(.2,.9,.3,1.6) backwards, shine 2.4s ease-in-out 1s infinite; filter: drop-shadow(0 2px 8px rgba(255, 209, 102, 0.6)); }
@keyframes shine { 0%, 100% { filter: drop-shadow(0 2px 8px rgba(255,209,102,0.6)); transform: scale(1); } 50% { filter: drop-shadow(0 0 16px rgba(255,226,120,1)) brightness(1.15); transform: scale(1.08); } }
.stars { position: relative; }
.stars .st { position: relative; display: grid; place-items: center; }
.stars .rays { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; display: none; pointer-events: none; z-index: -1; opacity: 0;
  background: repeating-conic-gradient(rgba(255,214,90,0.28) 0 10deg, transparent 10deg 30deg); -webkit-mask: radial-gradient(circle, #000 20%, transparent 68%); mask: radial-gradient(circle, #000 20%, transparent 68%);

<script>
// ---------- In-app purchase: Remove Ads, one-time (non-consumable) ----------
// Apple and Google keep the ownership record, tied to the player's Apple ID / Google account.
// The app re-reads it from the store on every launch (this also catches refunds) and on "Restore purchases".
// localStorage only caches the answer so the game knows instantly at launch, even offline.
window.Store = (function () {
  const PRODUCTS = {
    noAds: { id: 'landscraper_no_ads', price: '$4.99', cache: 'ls_noads' },
    sea: { id: 'landscraper_pack_sea', price: '$2.99', cache: 'ls_pack_sea' },
    space: { id: 'landscraper_pack_space', price: '$2.99', cache: 'ls_pack_space' },
    pool: { id: 'landscraper_pack_pool', price: '$2.99', cache: 'ls_pack_pool' },
    allSkins: { id: 'landscraper_all_skins', price: '$5.99', cache: 'ls_all_skins' },
    bundle: { id: 'landscraper_bundle', price: '$9.99', cache: 'ls_bundle' }
  };
  const cap = window.Capacitor;
  const platform = cap && cap.getPlatform ? cap.getPlatform() : 'web';
  const native = platform === 'android' || platform === 'ios';
  const NP = native && window.capacitorExports ? window.capacitorExports.registerPlugin('NativePurchases') : null;
  const owns = {};
  for (const k in PRODUCTS) { try { owns[k] = localStorage.getItem(PRODUCTS[k].cache) === '1'; } catch (e) { owns[k] = false; } }

  function set(k, v) {
    owns[k] = !!v;
    try { localStorage.setItem(PRODUCTS[k].cache, owns[k] ? '1' : '0'); } catch (e) {}
    document.dispatchEvent(new Event('store:change'));
  }
  const keyFor = (productId) => Object.keys(PRODUCTS).find((k) => PRODUCTS[k].id === productId);
  const valid = (t) => !t.revocationDate && (platform !== 'android' || String(t.purchaseState) === '1');

  // Ask the store what this account owns. Only a successful answer changes the cached state.
  async function refresh() {
    if (!NP) return;
    try {
      const r = await NP.getPurchases({ productType: 'inapp', onlyCurrentEntitlements: true });
      const list = (r && r.purchases) || [];
      const found = {};
      for (const t of list) {
        const k = keyFor(t.productIdentifier);
        if (!k || !valid(t)) continue;
        found[k] = true;
        // Google refunds purchases that are not acknowledged within 3 days.
        if (platform === 'android' && t.isAcknowledged === false && t.purchaseToken) {
          try { await NP.acknowledgePurchase({ purchaseToken: t.purchaseToken }); } catch (e) {}
        }
      }
      for (const k in PRODUCTS) set(k, !!found[k]);
    } catch (e) { /* offline or store unavailable: keep the cached answers */ }
  }

  async function loadPrices() {
    if (!NP) return;
    try {
      const r = await NP.getProducts({ productIdentifiers: Object.values(PRODUCTS).map((p) => p.id), productType: 'inapp' });
      for (const p of (r && r.products) || []) {
        const k = keyFor(p.identifier || p.productIdentifier || p.id);
        if (k && p.priceString) PRODUCTS[k].price = p.priceString;
      }
      document.dispatchEvent(new Event('store:change'));
    } catch (e) {}
  }

  // Returns 'bought', 'cancelled' or 'error'.
  async function buy(k) {
    if (!NP) { set(k, true); return 'bought'; } // browser preview: simulated purchase
    try {
      const t = await NP.purchaseProduct({ productIdentifier: PRODUCTS[k].id, productType: 'inapp', isConsumable: false, autoAcknowledgePurchases: true });
      if (t && keyFor(t.productIdentifier) === k && valid(t)) { set(k, true); return 'bought'; }
      await refresh();
      return owns[k] ? 'bought' : 'error';
    } catch (e) {
      const msg = String((e && (e.message || e.code)) || e).toLowerCase();
      if (msg.includes('cancel')) return 'cancelled';
      await refresh(); // e.g. "already owned"

    }
  }

  // Returns the list of owned product keys after restoring.
  async function restore() {
    if (NP) { try { await NP.restorePurchases(); } catch (e) {} await refresh(); }
    return Object.keys(owns).filter((k) => owns[k]);
  }

  if (NP) {
    try { NP.addListener('transactionUpdated', () => refresh()); } catch (e) {}
    refresh(); loadPrices();
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  }

  return {
    owns: (k) => !!owns[k],
    noAds: () => !!(owns.noAds || owns.bundle),
    pack: (k) => !!(owns[k] || owns.allSkins || owns.bundle), // a skin pack: bought alone, or with All Skins or Everything
    allSkins: () => !!(owns.allSkins || owns.bundle || (owns.sea && owns.space && owns.pool)),
    price: (k) => PRODUCTS[k || 'noAds'].price,
    buy: (k) => buy(k || 'noAds'),
    restore, refresh, isNative: native
  };
})();
