<title>Landscraper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=DM+Mono:wght@500&display=swap">
<style>
:root {
  --ink: #ffffff;
  --ink-soft: rgba(255, 255, 255, 0.78);
  --shade: rgba(16, 24, 56, 0.55);
  --card: rgba(18, 24, 58, 0.72);
  --line: rgba(255, 255, 255, 0.18);
  --gold: #ffd166;
  --bad: #ff5a7a;
  --good: #7cf3c4;
  --display: 'Unbounded', 'Arial Black', system-ui, sans-serif;
  --mono: 'DM Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body {
  background: #1b2a55; color: var(--ink); font-family: var(--mono);
  overflow: hidden; touch-action: none; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#stage { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(180deg, var(--sky1, #7cc8ff) 0%, var(--sky2, #d6efff) 100%); transition: background 0.6s; }
#stage canvas { position: absolute; inset: 0; display: block; }
.ts { text-shadow: 0 1px 8px rgba(10, 20, 50, 0.45); }

/* HUD */
#hud {
  position: absolute; left: 0; right: 0; top: 0; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; pointer-events: none;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px));
}
#pauseBtn {
  pointer-events: auto; width: 40px; height: 40px; border-radius: 14px; border: 0; cursor: pointer; display: grid; place-items: center;
  background: var(--shade); color: var(--ink); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
#pauseBtn svg { width: 16px; height: 16px; }
.mid { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.mid .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }
.mid .row b { font: 800 15px var(--display); letter-spacing: 0; }
.bar { position: relative; height: 12px; border-radius: 999px; background: var(--shade); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px; background: linear-gradient(90deg, #7cf3c4, #4fd2ff); transition: width 0.45s cubic-bezier(.2,.9,.3,1.2); }
.bar.goal i { background: linear-gradient(90deg, #ffd166, #ff9f5a); }
.bar em { position: absolute; top: -2px; bottom: -2px; width: 3px; border-radius: 2px; background: #fff; box-shadow: 0 0 6px rgba(255,255,255,0.8); }
.lives { display: flex; gap: 4px; }
.lives svg { width: 20px; height: 20px; filter: drop-shadow(0 1px 4px rgba(10,20,50,0.4)); }
.lives svg.off { opacity: 0.28; }
#power { position: absolute; top: calc(66px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); pointer-events: none; display: flex; gap: 8px; }
#power span { padding: 5px 10px; border-radius: 999px; background: var(--shade); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }

#flash {
  position: absolute; left: 50%; top: 20%; transform: translate(-50%, 0) scale(0.9); text-align: center; pointer-events: none;
  font: 800 clamp(24px, 8vw, 36px)/1.1 var(--display); white-space: nowrap; opacity: 0; transition: opacity 0.2s, transform 0.25s cubic-bezier(.2,.9,.3,1.4);
  text-shadow: 0 3px 0 rgba(20, 30, 80, 0.35), 0 4px 18px rgba(20, 10, 40, 0.35);
}
#flash.show { opacity: 1; transform: translate(-50%, -6px) scale(1); }
#flash small { display: block; margin-top: 8px; font: 500 12px var(--mono); letter-spacing: 0.16em; text-transform: uppercase; text-shadow: 0 1px 6px rgba(10,20,50,0.5); }
#flash.bad { color: #ffe0e6; }
.pop { position: absolute; pointer-events: none; font: 800 18px var(--display); color: #fff; text-shadow: 0 2px 0 rgba(20,30,80,0.35); transform: translate(-50%, -50%); animation: pop 1s ease-out forwards; }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, -30%) scale(0.6); } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -160%) scale(1); } }
#vignette { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 120px 30px rgba(255, 40, 80, 0.55); opacity: 0; transition: opacity 0.35s; }
#vignette.on { opacity: 1; transition: none; }

/* direction pad that appears under the finger */
#pad { position: absolute; width: 88px; height: 88px; margin: -44px 0 0 -44px; pointer-events: none; opacity: 0; transition: opacity 0.15s; }
#pad.on { opacity: 1; }
#pad .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(255,255,255,0.55); background: rgba(16, 24, 56, 0.18); }
#pad .ring::before, #pad .ring::after { content: ''; position: absolute; left: 50%; top: 50%; background: rgba(255,255,255,0.25); }
#pad .ring::before { width: 2px; height: 70%; transform: translate(-50%, -50%); }
#pad .ring::after { width: 70%; height: 2px; transform: translate(-50%, -50%); }
#pad .knob { position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: #fff; box-shadow: 0 2px 10px rgba(10,20,50,0.35); transition: transform 0.08s; display: grid; place-items: center; }
#pad .knob svg { width: 16px; height: 16px; color: #2a3a7a; transition: transform 0.08s; }

/* panels */
#panel {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: calc(20px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(12, 18, 44, 0.38);
}
.card {
  width: min(360px, 100%); max-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 14px;
  padding: 24px 20px 20px; border-radius: 28px; text-align: center; overflow-y: auto;
  background: var(--card); border: 1px solid var(--line); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  animation: cardIn 0.35s cubic-bezier(.2,.9,.3,1.25);
}
@keyframes cardIn { from { opacity: 0; transform: translateY(18px) scale(0.96); } }
.card h1 { margin: 0; font: 800 34px/1 var(--display); letter-spacing: -0.01em; }
.card h2 { margin: 0; font: 800 26px/1.05 var(--display); text-wrap: balance; }
.card p { margin: 0; font-size: 13px; line-height: 1.5; color: var(--ink-soft); text-wrap: balance; }
.card .kicker { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
.card .big { font: 800 44px/1 var(--display); font-variant-numeric: tabular-nums; }
.btns { width: 100%; display: flex; flex-direction: column; gap: 10px; }
.btn {
  cursor: pointer; width: 100%; padding: 15px 18px; border-radius: 999px; border: 0;
  background: #fff; color: #1d2a63; font: 500 13px var(--mono); letter-spacing: 0.14em; text-transform: uppercase;
  box-shadow: 0 4px 0 rgba(10, 20, 60, 0.35);
}
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(10, 20, 60, 0.35); }
.btn.alt { background: rgba(255,255,255,0.12); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.stars { display: flex; gap: 10px; }
.stars svg { width: 44px; height: 44px; color: rgba(255,255,255,0.18); }
.stars svg.on { color: var(--gold); animation: star 0.45s cubic-bezier(.2,.9,.3,1.6) backwards; filter: drop-shadow(0 2px 8px rgba(255, 209, 102, 0.6)); }
@keyframes star { from { transform: scale(0) rotate(-40deg); } }
.foe { display: grid; place-items: center; width: 96px; height: 96px; border-radius: 50%; background: rgba(255,255,255,0.08); }
.foe img { width: 88px; height: 88px; }
.eps { width: 100%; display: flex; flex-direction: column; gap: 18px; text-align: left; }
.ep h3 { margin: 0 0 8px; font: 800 15px var(--display); display: flex; justify-content: space-between; align-items: baseline; }
.ep h3 small { font: 500 11px var(--mono); letter-spacing: 0.14em; color: var(--ink-soft); }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.lvl { cursor: pointer; aspect-ratio: 1; border-radius: 14px; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background: rgba(255,255,255,0.14); color: var(--ink); font: 800 16px var(--display); }
.lvl small { font: 500 9px var(--mono); letter-spacing: 0.06em; color: var(--gold); min-height: 11px; }
.lvl.cur { background: #fff; color: #1d2a63; }
.lvl[disabled] { cursor: default; opacity: 0.4; }
.hint { position: absolute; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); text-align: center; pointer-events: none;
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); transition: opacity 0.4s; }
@media (prefers-reduced-motion: reduce) { #flash, .card, .stars svg.on, .pop { animation: none; transition: none; } }
</style>

<main id="stage">
  <div id="hud" hidden>
    <button id="pauseBtn" type="button" aria-label="Pause"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="2" width="3.5" height="12" rx="1.2"/><rect x="9.5" y="2" width="3.5" height="12" rx="1.2"/></svg></button>
    <div class="mid ts">
      <div class="row"><span><b id="lvlLabel">1-1</b></span><span id="pctLabel">0% · goal 75%</span></div>
      <div class="bar" id="bar"><i id="barFill"></i><em id="barGoal"></em></div>
    </div>
    <div class="lives" id="lives"></div>
  </div>
  <div id="power"></div>
  <div id="vignette"></div>
  <div id="flash"></div>
  <div id="pad"><div class="ring"></div><div class="knob"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 2 14 10H10V14H6V10H2Z"/></svg></div></div>
  <div class="hint" id="hint"></div>
  <div id="panel"><div class="card" id="card"></div></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Landscraper: Draw & Conquer. Xonix in 3D.
// Leave your land to draw a trail; get back to land to claim every area with no monster in it.
// On land you move only while your finger is down; out at sea you are committed until you reach land.
(() => {
  const $ = (id) => document.getElementById(id);
  const stage = $('stage');
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- sound and haptics ----------
  let ac = null;
  function tone(f, d, type, v, slide) {
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
      g.gain.setValueAtTime(v || 0.12, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
    } catch (e) {}
  }
  const arp = (notes, gap, dur, type) => notes.forEach((f, k) => setTimeout(() => tone(f, dur || 0.18, type), k * (gap || 70)));
  const capx = window.Capacitor && window.capacitorExports;
  const isApp = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  const Haptics = isApp && capx ? window.capacitorExports.registerPlugin('Haptics') : null;
  const VIBE = { tick: 5, claim: 12, big: [15, 30, 15], trap: [20, 40, 30], clear: [20, 40, 20, 40, 40], hit: [30, 40, 60], eat: 8 };
  function buzz(kind) {
    try {
      if (Haptics) {
        if (kind === 'tick' || kind === 'eat') Haptics.impact({ style: 'LIGHT' });
        else if (kind === 'claim') Haptics.impact({ style: 'MEDIUM' });
        else if (kind === 'big' || kind === 'trap') Haptics.impact({ style: 'HEAVY' });
        else if (kind === 'clear') Haptics.notification({ type: 'SUCCESS' });
        else if (kind === 'hit') Haptics.notification({ type: 'ERROR' });
      } else if (navigator.vibrate) navigator.vibrate(VIBE[kind] || 10);
    } catch (e) {}
  }

  // ---------- HUD helpers ----------
  let flashT = 0;
  function flash(text, small, ms, bad) {
    const f = $('flash');
    f.innerHTML = ''; f.append(text); f.classList.toggle('bad', !!bad);
    if (small) { const s = document.createElement('small'); s.textContent = small; f.append(s); }
    f.classList.remove('show'); void f.offsetWidth; f.classList.add('show');
    clearTimeout(flashT); flashT = setTimeout(() => f.classList.remove('show'), ms || 1000);
  }
  const HEART = '<svg viewBox="0 0 24 24" fill="#ff5a7a"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.4 2.3 4 6.3 4c2.2 0 3.6 1.2 4.7 2.6C12.1 5.2 13.5 4 15.7 4c4 0 5.9 4.4 4.3 7.7C19.5 16.4 12 21 12 21z"/></svg>';
  const STAR = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>';
  function panel(html, actions) {
    $('card').innerHTML = html; $('panel').hidden = false;
    $('card').querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', (e) => {
      e.stopPropagation(); const a = actions[b.dataset.act]; if (a) a(b);
    }));
  }
  const hidePanel = () => { $('panel').hidden = true; };
  function popAt(wx, wz, text, color) {
    const v = new THREE.Vector3(wx, 1.4, wz).project(camera);
    const d = document.createElement('div'); d.className = 'pop'; d.textContent = text;
    if (color) d.style.color = color;
    d.style.left = ((v.x + 1) / 2 * stage.clientWidth) + 'px'; d.style.top = ((1 - v.y) / 2 * stage.clientHeight) + 'px';
    stage.append(d); setTimeout(() => d.remove(), 1000);
  }

  // ---------- renderer and scene ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  stage.prepend(renderer.domElement);
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(46, 1, 0.1, 300);
  const hemi = new THREE.HemisphereLight(0xffffff, 0x5a6aa0, 0.62); scene.add(hemi);
  const sunL = new THREE.DirectionalLight(0xfff4e0, 0.62); sunL.position.set(-6, 14, 8); scene.add(sunL);

  const W = 24, Hh = 38, N = W * Hh;
  const SEA = 0, LAND = 1, TRAIL = 2;
  const TRAP_MAX = 40; // a monster enclosed in a sea area this small (cells) is trapped
  const SPEED = 9, FUSE = 2.5; // cells per second; the fuse runs 2.5x faster than you
  const cells = new Uint8Array(N), fixed = new Uint8Array(N); // fixed: border and obstacles (not counted, never eaten)
  const idx = (x, y) => y * W + x;
  const inside = (x, y) => x >= 0 && y >= 0 && x < W && y < Hh;
  const isBorder = (x, y) => x < 2 || y < 2 || x >= W - 2 || y >= Hh - 2;
  const ox = -W / 2 + 0.5, oz = -Hh / 2 + 0.5;
  const H_LAND = Math.fround(0.9);

  // ---------- worlds: procedural textures ----------
  function tileCanvas(paint) {
    const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
    const wrap = (fn) => { for (const dx of [-256, 0, 256]) for (const dy of [-256, 0, 256]) { g.save(); g.translate(dx, dy); fn(g); g.restore(); } };
    paint(g, wrap);
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; return t;
  }
  let seed = 7; const srand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const TEX = {
    grass: () => tileCanvas((g, wrap) => {
      seed = 11; g.fillStyle = '#6cc35a'; g.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 70; i++) { const x = srand() * 256, y = srand() * 256, r = 10 + srand() * 26, c = srand() < 0.5 ? 'rgba(120,214,96,0.45)' : 'rgba(78,170,72,0.4)', a = srand() * 3; wrap((h) => { h.fillStyle = c; h.beginPath(); h.ellipse(x, y, r, r * 0.7, a, 0, 7); h.fill(); }); }
      g.lineCap = 'round';
      for (let i = 0; i < 260; i++) { const x = srand() * 256, y = srand() * 256, a = -1.2 - srand() * 0.7, l = 4 + srand() * 5; g.strokeStyle = srand() < 0.5 ? 'rgba(60,140,58,0.55)' : 'rgba(160,232,120,0.55)'; g.lineWidth = 1.6; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
      for (let i = 0; i < 16; i++) { const x = srand() * 256, y = srand() * 256, c = ['#ffffff', '#ffe16b', '#ffb3cf'][i % 3]; wrap((h) => { h.fillStyle = c; for (let k = 0; k < 5; k++) { h.beginPath(); h.arc(x + Math.cos(k * 1.26) * 2.6, y + Math.sin(k * 1.26) * 2.6, 1.9, 0, 7); h.fill(); } h.fillStyle = '#ffcf40'; h.beginPath(); h.arc(x, y, 1.6, 0, 7); h.fill(); }); }
    }),
    sand: () => tileCanvas((g, wrap) => {
      seed = 23; g.fillStyle = '#f1cf8f'; g.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 40; i++) { const x = srand() * 256, y = srand() * 256, r = 14 + srand() * 30, c = srand() < 0.5 ? 'rgba(255,232,180,0.35)' : 'rgba(214,170,104,0.25)'; wrap((h) => { h.fillStyle = c; h.beginPath(); h.ellipse(x, y, r * 1.6, r, 0.3, 0, 7); h.fill(); }); }
      g.lineWidth = 2.2;
      for (let k = 0; k < 9; k++) { const y0 = k * 256 / 9 + 6, ph = srand() * 6.28; g.strokeStyle = 'rgba(190,138,70,0.38)'; g.beginPath(); for (let x = 0; x <= 256; x += 4) { const y = y0 + Math.sin(x / 256 * 6.283 * 2 + ph) * 7 + Math.sin(x / 256 * 6.283 + ph * 2) * 4; x ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); g.strokeStyle = 'rgba(255,240,200,0.5)'; g.lineWidth = 1.2; g.beginPath(); for (let x = 0; x <= 256; x += 4) { const y = y0 + 3 + Math.sin(x / 256 * 6.283 * 2 + ph) * 7 + Math.sin(x / 256 * 6.283 + ph * 2) * 4; x ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); g.lineWidth = 2.2; }
      for (let i = 0; i < 500; i++) { g.fillStyle = srand() < 0.5 ? 'rgba(150,100,50,0.35)' : 'rgba(255,255,240,0.6)'; g.fillRect(srand() * 256, srand() * 256, 1.4, 1.4); }
    }),
    snow: () => tileCanvas((g, wrap) => {
      seed = 31; g.fillStyle = '#eef5ff'; g.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 50; i++) { const x = srand() * 256, y = srand() * 256, r = 12 + srand() * 30, c = srand() < 0.6 ? 'rgba(200,222,255,0.45)' : 'rgba(255,255,255,0.7)', a = srand() * 3; wrap((h) => { h.fillStyle = c; h.beginPath(); h.ellipse(x, y, r, r * 0.8, a, 0, 7); h.fill(); }); }
      g.lineWidth = 1.4; g.strokeStyle = 'rgba(120,160,225,0.55)';
      for (let i = 0; i < 14; i++) { const x = srand() * 256, y = srand() * 256, path = []; let qx = x, qy = y; for (let k = 0; k < 5; k++) { qx += (srand() - 0.5) * 30; qy += (srand() - 0.5) * 30; path.push([qx, qy]); } wrap((h) => { h.beginPath(); h.moveTo(x, y); path.forEach(([a, b]) => h.lineTo(a, b)); h.stroke(); }); }
      for (let i = 0; i < 120; i++) { g.fillStyle = 'rgba(255,255,255,0.95)'; const x = srand() * 256, y = srand() * 256; g.fillRect(x, y, 2, 2); }
    })
  };
  const WORLDS = [
    { name: 'Meadow', tex: 'grass', side: 0x9b6a45, sky: ['#6ec3ff', '#d9f1ff'], deep: '#1677b8', shallow: '#3fd0ea', foam: '#effcff', trail: 0xfff27a },
    { name: 'Dunes', tex: 'sand', side: 0xc98a4c, sky: ['#ffb36e', '#ffe7c4'], deep: '#0d8a92', shallow: '#46e0c8', foam: '#f4fffb', trail: 0xffffff },
    { name: 'Glacier', tex: 'snow', side: 0x7d9ed8, sky: ['#8f9cff', '#e3e8ff'], deep: '#18306e', shallow: '#3a6cc8', foam: '#ffffff', trail: 0xffe46b }
  ];
  const texCache = {};
  const worldTex = (w) => texCache[w.tex] || (texCache[w.tex] = TEX[w.tex]());

  // ---------- floor: animated water with grid and shoreline foam ----------
  const maskData = new Uint8Array(N * 4);
  const mask = new THREE.DataTexture(maskData, W, Hh, THREE.RGBAFormat);
  mask.magFilter = THREE.LinearFilter; mask.minFilter = THREE.LinearFilter; mask.needsUpdate = true;
  const floorMat = new THREE.ShaderMaterial({
    uniforms: { uMask: { value: mask }, uTime: { value: 0 }, uSize: { value: new THREE.Vector2(W, Hh) },
      uDeep: { value: new THREE.Color() }, uShallow: { value: new THREE.Color() }, uFoam: { value: new THREE.Color() } },

  const dq = new THREE.Quaternion(), dpos = new THREE.Vector3(), dscl = new THREE.Vector3(1, 1, 1), UP = new THREE.Vector3(0, 1, 0);

  }
  function lightFuse(k) {

    else if (k > fuse.pos) fuse.pos = k;

  // ---------- camera ----------

  // ---------- update ----------
  const zero = new THREE.Vector3();
  function update(dt, t) {
    floorMat.uniforms.uTime.value = t;
    if (shake > 0) shake = Math.max(0, shake - dt);

    // tiles: a springy rise

    for (let i = 0; i < N; i++) {

    if (dirty) { tiles.instanceMatrix.needsUpdate = true; if (tiles.instanceColor) tiles.instanceColor.needsUpdate = true; }
    const live = state === 'play' && !paused;
    // player
    if (live) {
      if (invuln > 0) invuln -= dt;
      if (slowT > 0) slowT = Math.max(0, slowT - dt);
      if (frozenT > 0) frozenT = Math.max(0, frozenT - dt);

      if (Math.floor(t * 2) !== Math.floor((t - dt) * 2)) drawHud();
    }
    const fx = px + (tx - px) * stepP, fy = py + (ty - py) * stepP;
    const onLand = cellAt(fx + 0.5, fy + 0.5) === LAND;
    const ground = (x, y) => { const i = idx(clamp(Math.round(x), 0, W - 1), clamp(Math.round(y), 0, Hh - 1)); return Math.max(0, hNow[i]); };
    const gy = Math.max(ground(px, py) * (1 - stepP) + ground(tx, ty) * stepP, 0);
    let drop = 0, entering = false;
    if (hideT > 0) { entering = true; if (!paused) { hideT -= dt; if (hideT <= 0) tone(220, 0.9, 'sine', 0.06, 880); } }
    else if (enterT > 0) {

      body.scale.set(1 + (k > 0.9 ? (k - 0.9) * 2.5 : 0), 1 - (k > 0.9 ? (k - 0.9) * 3 : 0), 1 + (k > 0.9 ? (k - 0.9) * 2.5 : 0));
      if (!paused) { enterT -= dt; if (enterT <= 0) { body.scale.set(1, 1, 1); drone.scale.setScalar(1.45); landed(); } }
    }
    beamMat.opacity = hideT > 0 ? 0.5 + 0.2 * Math.sin(t * 20) : enterT > 0 ? 0.6 * (enterT / ENTER) : 0; beam.visible = beamMat.opacity > 0.01;
    padMat.opacity = entering ? 0.6 + 0.35 * Math.sin(t * 14) : 0.4;
    if (shockT > 0) { shockT -= dt; const q = 1 - shockT / 0.5; shock.scale.setScalar(1 + q * 4); shockMat.opacity = Math.max(0, 1 - q); } else shockMat.opacity = 0;
    drone.position.set(fx + ox, gy + 0.55 + drop + Math.sin(t * 4) * 0.05, fy + oz);
    const mdx = tx - px, mdy = ty - py;
    if (dir && !entering) { const want = Math.atan2(DIRS[dir][0], DIRS[dir][1]); let d = want - drone.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); drone.rotation.y += d * Math.min(1, dt * 14); }

    rotors.forEach((r, k) => { r.rotation.y += dt * (k % 2 ? 30 : -30); });
    drone.visible = hideT > 0 ? false : enterT > 0 ? true : !(invuln > 0 && state === 'play' && Math.floor(t * 12) % 2);
    droneShadow.position.set(fx + ox, gy + 0.02, fy + oz); droneShadow.visible = drone.visible; droneShadow.scale.setScalar(1.4 * (1 - Math.min(0.75, drop / 10)));
    chev.visible = !!dir && live; if (dir) { const [dx, dy] = DIRS[dir]; chev.position.set(fx + ox + dx * 0.85, gy + 0.03, fy + oz + dy * 0.85); chev.rotation.y = Math.atan2(-dx, -dy); }

    if (fuse && live) {

        const k = Math.floor(fuse.pos), f = fuse.pos - k, a = k === 0 ? trailFrom : trail[k - 1], b = trail[k];
        const ax = a % W, ay = (a / W) | 0, bx = b % W, by = (b / W) | 0;
        spark.position.set(ax + (bx - ax) * f + ox, 0.15, ay + (by - ay) * f + oz); spark.visible = true; spark.scale.setScalar(1 + Math.sin(t * 40) * 0.3);
        spark.material.color.setHSL(0.02 + Math.random() * 0.08, 1, 0.6);
        burnt.count = Math.min(dashes.count, Math.ceil(fuse.pos * 2));

      }

      p.t += dt; const [wx, wz] = W2(p.x, p.y);
      if (p.taken) { p.mesh.scale.multiplyScalar(Math.max(0, 1 - dt * 6)); p.mesh.position.y += dt * 3; continue; }
      if (live && Math.hypot(p.x - fx, p.y - fy) < 1.2) { takePower(p); continue; } // fly through it to collect it
      p.mesh.position.set(wx, Math.max(0, hNow[idx(p.x, p.y)]) + 0.55 + Math.sin(p.t * 3) * 0.1, wz); p.mesh.rotation.set(-0.75, Math.sin(p.t * 2) * 0.5, 0); // faces the camera, gently swaying

    powers = powers.filter((p) => { if (p.taken && p.mesh.scale.x < 0.02) { scene.remove(p.mesh); return false; } return true; });

  }

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false); renderer.domElement.style.width = w + 'px'; renderer.domElement.style.height = h + 'px';
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    // Fit the whole board on any screen shape: find the closest camera distance where every board corner

    const top = 1 - 2 * (($('hud').offsetHeight || 64) + 8) / Math.max(1, h), corners = [];
    for (const x of [-W / 2, W / 2]) for (const z of [-Hh / 2, Hh / 2]) for (const y of [-0.6, H_LAND]) corners.push(new THREE.Vector3(x, y, z));

    steer(d); padTo(d);
    sw = { x: e.clientX, y: e.clientY }; pad.style.left = (e.clientX - OFF[d][0] * 26) + 'px'; pad.style.top = (e.clientY - OFF[d][1] * 26) + 'px';
  });
  const release = () => { sw = null; touchHeld = false; pad.classList.remove('on'); };
  window.addEventListener('pointerup', release); window.addEventListener('pointercancel', release);
  const KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };
  window.addEventListener('keydown', (e) => {
    const k = KEYS[e.key]; if (!k) { if (e.key === 'Escape') showPause(); return; }

  });

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt, now / 1000);
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  resize(); build(Math.min(prog.unlocked, LEVELS.length - 1)); showTitle();
  requestAnimationFrame(loop);

  // Test hook (headless checks and store screenshots)
  window.__game = {
    get state() { return state; }, get pct() { return pct; }, get level() { return cur; }, get lives() { return lives; },
    get score() { return score; }, get pos() { return [px, py, stepP]; }, get dir() { return dir; }, get fuse() { return fuse && fuse.pos; },
    get monsters() { return monsters.map((m) => ({ kind: m.kind, x: m.x, y: m.y, dead: !!m.dead })); },
    get trailLen() { return trail.length; }, get rings() { return monsters.filter((m) => m.ring.visible).length; },
    steer, startLevel, hold(v) { touchHeld = !!v; },

    addMonster(kind, x, y, vx, vy) { const m = spawnMonster(kind, [x, y]); if (vx !== undefined) { m.vx = vx; m.vy = vy; } },

    trail(cellsXY, close) {

  };
})();
