<title>Landscraper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=DM+Mono:wght@500&display=swap">
<style>
:root {
  --ink: #ffffff;
  --ink-soft: rgba(255, 255, 255, 0.78);
  --shade: rgba(16, 24, 56, 0.55);
  --card: rgba(18, 24, 58, 0.72);
  --line: rgba(255, 255, 255, 0.18);
  --gold: #ffd166;
  --bad: #ff5a7a;
  --good: #7cf3c4;
  --display: 'Unbounded', 'Arial Black', system-ui, sans-serif;
  --mono: 'DM Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body {
  background: #1b2a55; color: var(--ink); font-family: var(--mono);
  overflow: hidden; touch-action: none; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#stage:focus { outline: none; }
#stage { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(180deg, var(--sky1, #7cc8ff) 0%, var(--sky2, #d6efff) 100%); transition: background 0.6s; }
#stage canvas { position: absolute; inset: 0; display: block; }
.ts { text-shadow: 0 1px 8px rgba(10, 20, 50, 0.45); }

/* HUD */
#hud {
  position: absolute; left: 0; right: 0; top: 0; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; pointer-events: none;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px));
}
#pauseBtn {
  pointer-events: auto; width: 40px; height: 40px; border-radius: 14px; border: 0; cursor: pointer; display: grid; place-items: center;
  background: var(--shade); color: var(--ink); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
#pauseBtn svg { width: 16px; height: 16px; }
.mid { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.mid .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }
.mid .row b { font: 800 15px var(--display); letter-spacing: 0; }
.bar { position: relative; height: 12px; border-radius: 999px; background: var(--shade); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px; background: linear-gradient(90deg, #7cf3c4, #4fd2ff); transition: width 0.45s cubic-bezier(.2,.9,.3,1.2); }
.bar.goal i { background: linear-gradient(90deg, #ffd166, #ff9f5a); }
.bar em { position: absolute; top: -2px; bottom: -2px; width: 3px; border-radius: 2px; background: #fff; box-shadow: 0 0 6px rgba(255,255,255,0.8); }
.endbar { position: relative; width: 100%; margin: 4px 0 2px; padding-bottom: 20px; }
.endbar .track { position: relative; height: 14px; border-radius: 999px; background: var(--shade); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.endbar .track i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px; background: linear-gradient(90deg, #7cf3c4, #4fd2ff); }
.endbar .track i.goal { background: linear-gradient(90deg, #ffd166, #ff9f5a); }
.endbar .tk { position: absolute; top: -3px; width: 2px; height: 20px; margin-left: -1px; background: rgba(255,255,255,0.5); border-radius: 2px; }
.endbar .tk svg { position: absolute; top: 20px; left: -8px; width: 18px; height: 18px; color: rgba(255,255,255,0.22); transition: color 0.2s, transform 0.25s cubic-bezier(.2,.9,.3,1.8); }
.endbar .tk.hit { background: #fff; }
.endbar .tk.hit svg { color: var(--gold); transform: scale(1.35); filter: drop-shadow(0 1px 5px rgba(255,209,102,0.7)); }
.card .more { transition: opacity 0.4s; }
.lives { display: flex; gap: 4px; }
.lives svg { width: 20px; height: 20px; filter: drop-shadow(0 1px 4px rgba(10,20,50,0.4)); }
.lives svg.off { opacity: 0.28; }
#power { position: absolute; top: calc(66px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); pointer-events: none; display: flex; gap: 8px; }
#power span { padding: 5px 10px; border-radius: 999px; background: var(--shade); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }

#flash {
  position: absolute; left: 50%; top: 20%; transform: translate(-50%, 0) scale(0.9); text-align: center; pointer-events: none;
  font: 800 clamp(24px, 8vw, 36px)/1.1 var(--display); white-space: nowrap; opacity: 0; transition: opacity 0.2s, transform 0.25s cubic-bezier(.2,.9,.3,1.4);
  text-shadow: 0 3px 0 rgba(20, 30, 80, 0.35), 0 4px 18px rgba(20, 10, 40, 0.35);
}
#flash.show { opacity: 1; transform: translate(-50%, -6px) scale(1); }
#flash small { display: block; margin-top: 8px; font: 500 12px var(--mono); letter-spacing: 0.16em; text-transform: uppercase; text-shadow: 0 1px 6px rgba(10,20,50,0.5); }
#flash.bad { color: #ffe0e6; }
.pop { position: absolute; pointer-events: none; font: 800 18px var(--display); color: #fff; text-shadow: 0 2px 0 rgba(20,30,80,0.35); transform: translate(-50%, -50%); animation: pop 1s ease-out forwards; }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, -30%) scale(0.6); } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -160%) scale(1); } }
#vignette { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 120px 30px rgba(255, 40, 80, 0.55); opacity: 0; transition: opacity 0.35s; }
#vignette.on { opacity: 1; transition: none; }

/* direction pad: appears where the finger lands and stays there; the active arrow lights up */
#pad { position: absolute; width: 112px; height: 112px; margin: -56px 0 0 -56px; pointer-events: none; opacity: 0; transform: scale(0.85); transition: opacity 0.12s, transform 0.18s cubic-bezier(.2,.9,.3,1.4); }
#pad.on { opacity: 1; transform: scale(1); }
#pad .ring { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0.32), rgba(255,255,255,0.1) 60%, rgba(255,255,255,0.05)); box-shadow: inset 0 0 0 2px rgba(255,255,255,0.55), 0 6px 18px rgba(10,20,50,0.25); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
#pad .ar { position: absolute; width: 26px; height: 26px; left: 43px; top: 43px; color: rgba(255,255,255,0.75); transition: color 0.1s, transform 0.12s; filter: drop-shadow(0 1px 2px rgba(10,20,50,0.4)); }
#pad .ar svg { width: 100%; height: 100%; }
#pad .ar.up { transform: translateY(-34px); } #pad .ar.down { transform: translateY(34px) rotate(180deg); }
#pad .ar.left { transform: translateX(-34px) rotate(-90deg); } #pad .ar.right { transform: translateX(34px) rotate(90deg); }
#pad .ar.lit { color: #ffd166; }
#pad .ar.up.lit { transform: translateY(-38px) scale(1.2); } #pad .ar.down.lit { transform: translateY(38px) rotate(180deg) scale(1.2); }
#pad .ar.left.lit { transform: translateX(-38px) rotate(-90deg) scale(1.2); } #pad .ar.right.lit { transform: translateX(38px) rotate(90deg) scale(1.2); }
#pad .knob { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(10,20,50,0.35); transition: transform 0.1s; }

/* coach: short tips with a moving finger, first level only */
#coach { position: absolute; left: 0; right: 0; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 14px; pointer-events: none; opacity: 0; transition: opacity 0.25s; }
#coach.on { opacity: 1; }
#coach b { padding: 10px 18px; border-radius: 999px; background: rgba(16, 24, 56, 0.72); font: 800 18px var(--display); color: #fff; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
#coach .finger { width: 46px; height: 46px; filter: drop-shadow(0 3px 6px rgba(10,20,50,0.4)); animation: swipeUp 1.3s ease-in-out infinite; }
#coach .finger[hidden] { display: none; }
@keyframes swipeUp { 0% { transform: translateY(26px); opacity: 0; } 20% { opacity: 1; } 70% { transform: translateY(-34px); opacity: 1; } 100% { transform: translateY(-40px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #coach .finger { animation: none; } }

/* panels */
#panel {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: calc(20px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(12, 18, 44, 0.38);
}
.card {
  width: min(360px, 100%); max-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 14px;
  padding: 24px 20px 20px; border-radius: 28px; text-align: center; overflow-y: auto;
  background: var(--card); border: 1px solid var(--line); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  animation: cardIn 0.35s cubic-bezier(.2,.9,.3,1.25);
}
@keyframes cardIn { from { opacity: 0; transform: translateY(18px) scale(0.96); } }
.card h1 { margin: 0; font: 800 34px/1 var(--display); letter-spacing: -0.01em; }
.card h2 { margin: 0; font: 800 26px/1.05 var(--display); text-wrap: balance; }
.card p { margin: 0; font-size: 13px; line-height: 1.5; color: var(--ink-soft); text-wrap: balance; }
.card .kicker { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
.card .big { font: 800 44px/1 var(--display); font-variant-numeric: tabular-nums; }
.card .got { font: 800 17px var(--display); color: var(--gold); letter-spacing: 0; }
.btns { width: 100%; display: flex; flex-direction: column; gap: 10px; }
.btn {
  cursor: pointer; width: 100%; padding: 15px 18px; border-radius: 999px; border: 0;
  background: #fff; color: #1d2a63; font: 500 13px var(--mono); letter-spacing: 0.14em; text-transform: uppercase;
  box-shadow: 0 4px 0 rgba(10, 20, 60, 0.35);
}
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(10, 20, 60, 0.35); }
.btn.alt { background: rgba(255,255,255,0.12); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.stars { display: flex; gap: 10px; }
.stars svg { width: 44px; height: 44px; color: rgba(255,255,255,0.18); }
.stars svg.on { color: var(--gold); animation: star 0.45s cubic-bezier(.2,.9,.3,1.6) backwards; filter: drop-shadow(0 2px 8px rgba(255, 209, 102, 0.6)); }
@keyframes star { from { transform: scale(0) rotate(-40deg); } }
.foe { display: grid; place-items: center; width: 96px; height: 96px; border-radius: 50%; background: rgba(255,255,255,0.08); }
.foe img { width: 88px; height: 88px; }
.eps { width: 100%; display: flex; flex-direction: column; gap: 18px; text-align: left; }
.ep h3 { margin: 0 0 8px; font: 800 15px var(--display); display: flex; justify-content: space-between; align-items: baseline; }
.ep h3 small { font: 500 11px var(--mono); letter-spacing: 0.14em; color: var(--ink-soft); }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.lvl { cursor: pointer; aspect-ratio: 1; border-radius: 14px; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background: rgba(255,255,255,0.14); color: var(--ink); font: 800 16px var(--display); }
.lvl small { font: 500 9px var(--mono); letter-spacing: 0.06em; color: var(--gold); min-height: 11px; }
.lvl.cur { background: #fff; color: #1d2a63; }
.lvl[disabled] { cursor: default; opacity: 0.4; }
.modes { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode { cursor: pointer; border: 0; border-radius: 20px; padding: 14px 12px; text-align: left; display: flex; flex-direction: column; gap: 4px; background: rgba(255,255,255,0.12); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); font: 500 11px var(--mono); }
.mode b { font: 800 17px var(--display); }
.mode span { color: var(--ink-soft); letter-spacing: 0.08em; text-transform: uppercase; }
.mode[disabled] { cursor: default; opacity: 0.5; }
.row3 { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.row3 .btn { padding: 12px 6px; font-size: 11px; }
.worlds { width: 100%; display: flex; flex-direction: column; gap: 10px; }
.world { cursor: pointer; border: 0; border-radius: 20px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; color: #fff; text-align: left; box-shadow: inset 0 0 0 1px var(--line); }
.world b { font: 800 17px var(--display); display: block; }
.world span { font: 500 11px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.9; }
.world[disabled] { cursor: default; filter: grayscale(0.7); opacity: 0.55; }
.skins { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.skin { cursor: pointer; border: 0; border-radius: 16px; padding: 6px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; background: rgba(255,255,255,0.12); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.skin img, .skin i { width: 100%; aspect-ratio: 1; display: block; }
.skin b { font: 800 13px var(--display); }
.skin small { font: 500 9px var(--mono); letter-spacing: 0.06em; color: var(--gold); text-transform: uppercase; }
.skin.on { background: rgba(255,255,255,0.3); box-shadow: inset 0 0 0 2px #fff; }
.skin[disabled] { cursor: default; } .skin[disabled] img { filter: brightness(0) opacity(0.35); }
.cal { width: 100%; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; font: 500 11px var(--mono); }
.cal i { font-style: normal; color: var(--ink-soft); text-align: center; font-size: 10px; }
.cal div { aspect-ratio: 1; border-radius: 10px; display: grid; place-items: center; background: rgba(255,255,255,0.08); }
.cal div.done { background: var(--gold); color: #3a2a00; font-weight: 700; }
.cal div.today { box-shadow: inset 0 0 0 2px #fff; }
.cal div.blank { background: none; }
.hint { position: absolute; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); text-align: center; pointer-events: none;
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); transition: opacity 0.4s; }
@media (prefers-reduced-motion: reduce) { #flash, .card, .stars svg.on, .pop { animation: none; transition: none; } }
</style>

<main id="stage" tabindex="-1">
  <div id="hud" hidden>
    <button id="pauseBtn" type="button" aria-label="Pause"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="2" width="3.5" height="12" rx="1.2"/><rect x="9.5" y="2" width="3.5" height="12" rx="1.2"/></svg></button>
    <div class="mid ts">
      <div class="row"><span><b id="lvlLabel">1-1</b></span><span id="pctLabel">0% · goal 75%</span></div>
      <div class="bar" id="bar"><i id="barFill"></i><em id="barGoal"></em></div>

  </div>
  <div id="power"></div>
  <div id="vignette"></div>
  <div id="flash"></div>
  <div id="pad"><div class="ring"></div><div class="ar up"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4 21 15h-6v5H9v-5H3z"/></svg></div><div class="ar down"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4 21 15h-6v5H9v-5H3z"/></svg></div><div class="ar left"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4 21 15h-6v5H9v-5H3z"/></svg></div><div class="ar right"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4 21 15h-6v5H9v-5H3z"/></svg></div><div class="knob"></div></div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Landscraper: Draw & Conquer. Xonix in 3D.
// Leave your land to draw a trail; get back to land to claim every area with no monster in it.
// On land you move only while your finger is down; out at sea you are committed until you reach land.
(() => {
  const $ = (id) => document.getElementById(id);
  const stage = $('stage');
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const rand = (a, b) => a + Math.random() * (b - a);
  let rng = Math.random; // monster and booster placement; seeded for the Daily
  const seeded = (n) => () => { n |= 0; n = (n + 0x6D2B79F5) | 0; let t = Math.imul(n ^ (n >>> 15), 1 | n); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- sound and haptics ----------
  const settings = Object.assign({ sound: true, haptics: true }, store.get('ls_settings', {}));
  let ac = null;
  function tone(f, d, type, v, slide) {
    try {
      if (!settings.sound) return;
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
      g.gain.setValueAtTime(v || 0.12, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
    } catch (e) {}
  }
  const arp = (notes, gap, dur, type) => notes.forEach((f, k) => setTimeout(() => tone(f, dur || 0.18, type), k * (gap || 70)));
  const capx = window.Capacitor && window.capacitorExports;
  const isApp = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  const Haptics = isApp && capx ? window.capacitorExports.registerPlugin('Haptics') : null;
  // Haptics: light taps for steering and small events, heavier for claims and traps, a warning buzz for danger.
  const VIBE = { tick: 5, select: 4, soft: 6, claim: 12, big: [15, 30, 15], trap: [20, 40, 30], clear: [20, 40, 20, 40, 40], hit: [30, 40, 60], eat: 8, warn: [12, 50, 12], pickup: [10, 30, 18], split: 14 };
  let lastBuzz = 0;
  function buzz(kind) {
    if (!settings.haptics) return;
    const now = performance.now(); if ((kind === 'select' || kind === 'eat' || kind === 'tick') && now - lastBuzz < 70) return; lastBuzz = now;
    try {
      if (Haptics) {
        if (kind === 'tick' || kind === 'eat' || kind === 'select' || kind === 'soft') Haptics.impact({ style: 'LIGHT' });
        else if (kind === 'claim' || kind === 'split') Haptics.impact({ style: 'MEDIUM' });
        else if (kind === 'big' || kind === 'trap') Haptics.impact({ style: 'HEAVY' });
        else if (kind === 'clear' || kind === 'pickup') Haptics.notification({ type: 'SUCCESS' });
        else if (kind === 'warn') Haptics.notification({ type: 'WARNING' });
        else if (kind === 'hit') Haptics.notification({ type: 'ERROR' });
      } else if (navigator.vibrate) navigator.vibrate(VIBE[kind] || 10);
    } catch (e) {}
  }

  // ---------- HUD helpers ----------
  let flashT = 0;
  function flash(text, small, ms, bad) {
    const f = $('flash');
    f.innerHTML = ''; f.append(text); f.classList.toggle('bad', !!bad);
    if (small) { const s = document.createElement('small'); s.textContent = small; f.append(s); }
    f.classList.remove('show'); void f.offsetWidth; f.classList.add('show');
    clearTimeout(flashT); flashT = setTimeout(() => f.classList.remove('show'), ms || 1000);
  }
  const HEART = '<svg viewBox="0 0 24 24" fill="#ff5a7a"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.4 2.3 4 6.3 4c2.2 0 3.6 1.2 4.7 2.6C12.1 5.2 13.5 4 15.7 4c4 0 5.9 4.4 4.3 7.7C19.5 16.4 12 21 12 21z"/></svg>';
  const STAR = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>';
  function panel(html, actions) {
    $('card').innerHTML = html; $('panel').hidden = false;
    $('card').querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', (e) => {
      e.stopPropagation(); buzz('select'); const a = actions[b.dataset.act]; if (a) a(b);
    }));
  }
  const hidePanel = () => { $('panel').hidden = true; };
  function popAt(wx, wz, text, color) {
    const v = new THREE.Vector3(wx, 1.4, wz).project(camera);
    const d = document.createElement('div'); d.className = 'pop'; d.textContent = text;
    if (color) d.style.color = color;
    d.style.left = ((v.x + 1) / 2 * stage.clientWidth) + 'px'; d.style.top = ((1 - v.y) / 2 * stage.clientHeight) + 'px';
    stage.append(d); setTimeout(() => d.remove(), 1000);
  }

  // ---------- renderer and scene ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

        if (fishU.star) { fishU.star.rotation.z = Math.sin(m.t * 3) * 0.12; fishU.body.scale.set(pf * (1 + Math.sin(m.t * 6) * 0.04), pf, pf * (1 - Math.sin(m.t * 6) * 0.04)); } // a slow crawl-wiggle
        if (m.kind === 'hunter') { const glowOn = m.mode === 'aim' ? 0.55 + 0.45 * Math.sin(t * 30) : m.mode === 'dash' ? 0.7 : 0; fishU.skin.emissive.setRGB(glowOn, glowOn * 0.05, 0); }
      }
      if (m.mesh.userData.field) { const f = m.mesh.userData.field; f.rotation.y += dt; f.material.opacity = 0.25 + 0.2 * Math.sin(t * 4); }
      if (fishU && fishU.swirl) { fishU.swirl.rotation.y -= dt * 4; m.mesh.rotation.y = 0; }
      if (m.pop > 0) { m.pop = Math.max(0, m.pop - dt * 3); const q = 1 - m.pop; m.mesh.scale.setScalar(m.mesh.userData.s * (q < 0.7 ? q / 0.7 * 1.25 : 1.25 - (q - 0.7) / 0.3 * 0.25)); }

      }

      p.mesh.position.set(wx, Math.max(0, hNow[idx(clamp(p.x, 0, W - 1), clamp(p.y, 0, Hh - 1))]) + 0.55 + Math.sin(p.t * 3) * 0.1, wz); p.mesh.rotation.set(-0.75, Math.sin(p.t * 2) * 0.5, 0); // faces the camera, gently swaying

  }

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false); renderer.domElement.style.width = w + 'px'; renderer.domElement.style.height = h + 'px';
    camera.aspect = w / h;
    camera.updateProjectionMatrix();

    // Distance: the full board width always fits (checked at every visible row); on wide screens we also
    // come closer, showing about 70% of the board's length and following the player.
    const v = new THREE.Vector3(), saveShake = shake; shake = 0;
    const zoomW = asp < 0.62 ? 0.78 : 1; camXR = (W / 2 - 1.3) * (1 - zoomW); camTx = 0; const saveWX = camWantX; camWantX = 0;
    const widthFits = (d) => {
      camD = d; camRange(); camInit = false; camWantZ = (camLo + camHi) / 2; placeCamera(0, 0); camera.updateMatrixWorld();
      const g = camGeom(d), z0 = Math.max(-Hh / 2, camTz + g.top), z1 = Math.min(Hh / 2, camTz + g.bot);
      const hx = (W / 2 - 1.3) * zoomW; // phones show ~78% of the width and follow the player sideways
      for (const z of [z0, (z0 + z1) / 2, z1]) for (const x of [-hx, hx]) { v.set(x, H_LAND, z).project(camera); if (Math.abs(v.x) > 0.98) return false; }
      return true;
    };
    let lo = 8, hi = 300; for (let k = 0; k < 32; k++) { const mid = (lo + hi) / 2; if (widthFits(mid)) hi = mid; else lo = mid; }
    const g1 = camGeom(1), dDepth = 0.7 * (Hh + 1.8) / (g1.bot - g1.top);
    camD = Math.max(hi, dDepth); camRange(); camInit = false; shake = saveShake; camWantX = saveWX; placeCamera(0, 0);
  }
  window.addEventListener('resize', resize);

  // ---------- input: swipe anywhere (chained without lifting) or arrow keys ----------
  let sw = null;
  const pad = $('pad'), knob = pad.querySelector('.knob'), arrows = { up: pad.querySelector('.ar.up'), down: pad.querySelector('.ar.down'), left: pad.querySelector('.ar.left'), right: pad.querySelector('.ar.right') };
  const OFF = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  function padTo(d) { const [x, y] = d ? OFF[d] : [0, 0]; knob.style.transform = 'translate(' + x * 16 + 'px,' + y * 16 + 'px)'; for (const k in arrows) arrows[k].classList.toggle('lit', k === d); }

  });

    if (!sw) return;

  });

    get state() { return state; }, get pct() { return pct; }, get level() { return cur; }, get lives() { return lives; },
    get score() { return score; }, get pos() { return [px, py, stepP]; }, get dir() { return dir; }, get fuse() { return fuse && fuse.pos; },
