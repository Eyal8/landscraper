name: iOS signing inventory only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: macos-26-intel
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyJWT==2.10.1' 'cryptography==46.0.3'
      - name: Read existing Apple signing inventory
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          INVENTORY_OUTPUT: ${{ runner.temp }}/signing-inventory.json
        run: python scripts/signing-inventory.py
      - uses: actions/upload-artifact@v4
        with:
          name: apple-signing-inventory
          path: ${{ runner.temp }}/signing-inventory.json
